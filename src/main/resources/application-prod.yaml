server:
  port: ${PORT:8083}
  error:
    include-stacktrace: never

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET timezone TO 'UTC';

  thymeleaf:
    encoding: UTF-8

  server:
    tomcat:
      uri-encoding: UTF-8

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: b76bb2001@smtp-brevo.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        default_schema: guaridadb
  sql:
    init:
      mode: never

contacto:
  email: "jmmoraj@gmail.com"

logging:
  level:
    org:
      springframework:
        security: INFO